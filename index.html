        for (const [bName, targetQuat] of Object.entries(resetBonesQuats)) {
            const bone = this.vrm.humanoid.getNormalizedBoneNode(bName);
            if (bone) bone.quaternion.slerp(targetQuat, delta * 5);
        }
    }

    const breathScale = isLive ? 2.0 : 1.0;
    const chest = this.vrm.humanoid.getNormalizedBoneNode('chest');
    if (chest && this.state === 'IDLE_STAND' && !this.continuousMoveDir) {
        chest.rotation.x = Math.sin(time * 1.5) * 0.03 * breathScale; 
    }

    if (isLive && this.state === 'IDLE_STAND' && !this.continuousMoveDir && !this.isPlayingVRMA && !this.isThinking && !this.isSpeaking) {
        const lArm = this.vrm.humanoid.getNormalizedBoneNode('leftUpperArm'); 
        const rArm = this.vrm.humanoid.getNormalizedBoneNode('rightUpperArm');
        if (lArm) lArm.rotation.z = THREE.MathUtils.lerp(lArm.rotation.z, 1.25 + Math.sin(time * 1.2) * 0.05, delta * 5);
        if (rArm) rArm.rotation.z = THREE.MathUtils.lerp(rArm.rotation.z, -1.25 - Math.sin(time * 1.2) * 0.05, delta * 5);
        if (lArm) lArm.rotation.x = THREE.MathUtils.lerp(lArm.rotation.x, -0.05 + Math.cos(time * 0.8) * 0.05, delta * 5);
        if (rArm) rArm.rotation.x = THREE.MathUtils.lerp(rArm.rotation.x, -0.05 + Math.cos(time * 0.8) * 0.05, delta * 5);
    }

    if (this.isThinking && !this.isPlayingVRMA) {
        const rArm = this.vrm.humanoid.getNormalizedBoneNode('rightUpperArm'); const rElbow = this.vrm.humanoid.getNormalizedBoneNode('rightLowerArm');
        const wave = Math.sin(time * 1.5) * 0.05;
        if(rArm) { rArm.rotation.z = THREE.MathUtils.lerp(rArm.rotation.z, 0.1, delta * 4); rArm.rotation.x = THREE.MathUtils.lerp(rArm.rotation.x, -0.6 + wave, delta * 4); }
        if(rElbow) { rElbow.rotation.z = THREE.MathUtils.lerp(rElbow.rotation.z, 2.2 + wave * 2, delta * 4); rElbow.rotation.x = THREE.MathUtils.lerp(rElbow.rotation.x, 0.5, delta * 4); }
    }

    if (this.isSpeaking && !this.isPlayingVRMA && (this.state === 'IDLE_STAND' || this.state === 'ACTION')) {
        const rArm = this.vrm.humanoid.getNormalizedBoneNode('rightUpperArm'); const rElbow = this.vrm.humanoid.getNormalizedBoneNode('rightLowerArm');
        const wave = Math.sin(time * 2.0) * 0.05; 
        if (rArm) { rArm.rotation.z = THREE.MathUtils.lerp(rArm.rotation.z, -0.4, delta * 4); rArm.rotation.x = THREE.MathUtils.lerp(rArm.rotation.x, -0.1 + wave, delta * 4); }
        if (rElbow) { rElbow.rotation.z = THREE.MathUtils.lerp(rElbow.rotation.z, 0.4 + wave, delta * 4); }
    }

    if (this.state === 'IDLE_STAND' && elapsedSinceActivity > 15000 && !this.isThinking && !this.isSpeaking && !this.isListening) {
        this.changeState('WALKING_TO_BENCH');
    }
    
    if (this.state === 'WALKING_TO_BENCH') {
      const pos = this.vrm.scene.position; const dir = new THREE.Vector3().subVectors(this.benchPosition, pos); dir.y = 0;
      if (dir.length() > 0.1) {
        dir.normalize(); pos.add(dir.multiplyScalar(delta * 1.5));
        const lLeg = this.vrm.humanoid.getNormalizedBoneNode('leftUpperLeg'); const rLeg = this.vrm.humanoid.getNormalizedBoneNode('rightUpperLeg');
        if(lLeg) lLeg.rotation.x = Math.sin(time * 10) * 0.3; if(rLeg) rLeg.rotation.x = Math.sin(time * 10 + Math.PI) * 0.3;
        const targetQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, Math.atan2(-dir.x, -dir.z), 0));
        this.vrm.scene.quaternion.slerp(targetQuat, delta * 10);
      } else { this.vrm.scene.rotation.y = Math.PI; this.lastActivityTime = Date.now(); this.changeState('SITTING'); this.sittingStartTime = Date.now(); }
    }

    if (this.state === 'SITTING' || this.state === 'DOZING' || this.state === 'DEEP_SLEEP') {
      const sitElapsed = Date.now() - this.sittingStartTime;
      if (this.state === 'SITTING' && sitElapsed > 10000) this.changeState('DOZING');
      if (this.state === 'DOZING' && sitElapsed > 20000) this.changeState('DEEP_SLEEP');
      
      const hips = this.vrm.humanoid.getNormalizedBoneNode('hips');
      const lLeg = this.vrm.humanoid.getNormalizedBoneNode('leftUpperLeg'); const rLeg = this.vrm.humanoid.getNormalizedBoneNode('rightUpperLeg');
      const lKnee = this.vrm.humanoid.getNormalizedBoneNode('leftLowerLeg'); const rKnee = this.vrm.humanoid.getNormalizedBoneNode('rightLowerLeg');
      
      if(hips) hips.position.set(0, this.initialHipY - 0.45, 0.1); 
      if(lLeg) lLeg.rotation.x = 1.3; if(rLeg) rLeg.rotation.x = 1.3; if(lKnee) lKnee.rotation.x = -1.3; if(rKnee) rKnee.rotation.x = -1.3;

      if (this.state === 'DOZING') {
          if (chest) chest.rotation.x = Math.sin(time * 1.5) * 0.03;
          if (this.vrm.expressionManager) {
              const blinkVal = Math.sin(time * 2.5) > 0.8 ? 1.0 : 0.6 + Math.sin(time * 1.2) * 0.3;
              this.vrm.expressionManager.setValue('blink', blinkVal); this.vrm.expressionManager.setValue('relaxed', 0.5);
          }
      } else if (this.state === 'DEEP_SLEEP') {
          if (chest) chest.rotation.x = Math.sin(time * 1.0) * 0.04;
          if (this.vrm.expressionManager) { this.vrm.expressionManager.setValue('blink', 1.0); this.vrm.expressionManager.setValue('relaxed', 0.8); }
      }
    }

    if (this.proceduralJump > 0) {
      const hips = this.vrm.humanoid.getNormalizedBoneNode('hips');
      if(hips) hips.position.y = this.initialHipY + Math.sin(this.proceduralJump * Math.PI) * 0.5;
      this.proceduralJump -= delta * 2;
      if(this.proceduralJump <= 0) { this.proceduralJump = 0; if(hips) hips.position.y = this.initialHipY; this.changeState('IDLE_STAND'); }
    }
  }

  animate() {
    requestAnimationFrame(this.animate);
    let delta = this.clock.getDelta(); 
    if (delta > 0.1) delta = 0.1; 
    const time = this.clock.elapsedTime;
    
    this.noiseTime += delta;
    let targetPos = new THREE.Vector3();
    
    if (this.state === 'DOZING' || this.state === 'DEEP_SLEEP') {
        targetPos.set(0, -2, 2);
    } else if (this.isThinking) {
        const awayX = this.camera.position.x + Math.sin(time) * 1.5;
        const awayY = this.camera.position.y + 0.5 + Math.cos(time * 0.5) * 0.5;
        targetPos.set(awayX, awayY, this.camera.position.z);
    } else {
        targetPos.copy(this.camera.position);
    }

    targetPos.x += Math.sin(this.noiseTime * 2.1) * 0.05;
    targetPos.y += Math.cos(this.noiseTime * 1.7) * 0.05;

    this.dampedLookAtTarget.lerp(targetPos, delta * 2.5);
    
    if (this.lookAtTarget) {
        this.lookAtTarget.position.copy(this.dampedLookAtTarget);
    }

    if (this.mixer) this.mixer.update(delta);
    
    if (this.vrm) { 
        this.applyProceduralAnimation(time, delta); 
        
        const headNode = this.vrm.humanoid.getNormalizedBoneNode('head');
        const neckNode = this.vrm.humanoid.getNormalizedBoneNode('neck');
        
        if (headNode && !this.isPlayingVRMA && this.state !== 'DOZING' && this.state !== 'DEEP_SLEEP') {
            const targetWorldPos = this.dampedLookAtTarget.clone();
            
            const parentNode = headNode.parent;
            if (parentNode) {
                const parentInvMat = new THREE.Matrix4().copy(parentNode.matrixWorld).invert();
                const targetLocalPos = targetWorldPos.applyMatrix4(parentInvMat);
                const headLocalPos = headNode.position.clone();
                
                const localDir = new THREE.Vector3().subVectors(targetLocalPos, headLocalPos).normalize();
                
                const yaw = Math.atan2(-localDir.x, -localDir.z); 
                const pitch = Math.asin(localDir.y);
                
                const clampYaw = Math.max(-0.6, Math.min(0.6, yaw)); 
                const clampPitch = Math.max(-0.4, Math.min(0.4, pitch)); 
                
                const targetQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(clampPitch, clampYaw, 0, 'YXZ'));
                headNode.quaternion.slerp(targetQuat, delta * 6);
                
                if (neckNode) {
                    const neckQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(clampPitch * 0.5, clampYaw * 0.5, 0, 'YXZ'));
                    neckNode.quaternion.slerp(neckQuat, delta * 4);
                }
            }
        } else if (headNode && (this.state === 'DOZING' || this.state === 'DEEP_SLEEP')) {
            headNode.quaternion.slerp(new THREE.Quaternion().setFromEuler(new THREE.Euler(0.4, 0, 0, 'YXZ')), delta * 2);
            if (neckNode) neckNode.quaternion.slerp(new THREE.Quaternion().setFromEuler(new THREE.Euler(0.2, 0, 0, 'YXZ')), delta * 2);
        }

        this.vrm.update(delta); 

        if (this.needsPhysicsReset && this.vrm.springBoneManager) { 
            this.vrm.springBoneManager.reset(); this.needsPhysicsReset = false; 
        }
    }
    
    if (this.controls) this.controls.update();
    this.renderer.render(this.scene, this.camera);
  }
}

// --------------------------------------------------------
// [ExtensionModule] IndexedDB, VRMA管理, プレイリスト独立
// --------------------------------------------------------
class ExtensionModule {
  constructor(bus) {
    this.bus = bus; this.vrmaLibrary = []; this.playlist = []; this.currentPlayIndex = -1; 
    this.uiToggle = document.getElementById('vrm-ui-toggle'); this.uiContainer = document.getElementById('vrm-ui-container');
    this.libraryContainer = document.getElementById('library-container'); this.playlistContainer = document.getElementById('playlist-container');
    
    this.initUI(); this.initControllers(); this.initDB();
    
    this.bus.addEventListener('llm-response', (e) => {
      if (!e.detail.action || e.detail.action === 'none') return;
      const targetVrma = this.vrmaLibrary.find(v => v.name.toLowerCase() === e.detail.action.toLowerCase());
      this.bus.dispatchEvent(new CustomEvent('vrm-action', { detail: { actionName: targetVrma ? targetVrma.name : e.detail.action, animClip: targetVrma ? targetVrma.animClip : null, emotion: e.detail.emotion, playSource: e.detail.playSource } }));
    });
    this.bus.addEventListener('request-vrma-list', (e) => e.detail.callback(this.vrmaLibrary.map(item => item.name)));
    this.bus.addEventListener('vrma-finished', () => this.handlePlaylistSequence());
  }

  async initDB() {
    await DBManager.init();
    const savedVrm = await DBManager.getFile('saved_vrm');
    
    if(savedVrm) { 
        document.getElementById('vrm-local-info').innerText = `✅ 保存済み: ${savedVrm.name}`; 
        const btn = document.getElementById('btn-load-local-vrm');
        btn.style.display = 'block';
        btn.onclick = () => this.bus.dispatchEvent(new CustomEvent('vrm-load', { detail: { buffer: savedVrm.data } }));
        setTimeout(() => this.bus.dispatchEvent(new CustomEvent('vrm-load', { detail: { buffer: savedVrm.data } })), 500);
    }
    
    const savedVrmaList = await DBManager.getAll('vrma');
    if(savedVrmaList.length > 0) { 
        for (const item of savedVrmaList) await this.loadVRMAFromBuffer(item.id, item.name, item.data); 
        this.updateLibraryUI(); 
        try {
            const savedPlaylistIds = JSON.parse(localStorage.getItem('vrm_playlist_v2') || '[]');
            savedPlaylistIds.forEach(id => {
                const libItem = this.vrmaLibrary.find(v => v.id === id);
                if (libItem) this.playlist.push({ ...libItem });
            });
            this.updatePlaylistUI();
        } catch(e) {}
    }
  }

  savePlaylist() { localStorage.setItem('vrm_playlist_v2', JSON.stringify(this.playlist.map(item => item.id))); }

  initUI() {
    this.uiToggle.addEventListener('click', () => this.uiContainer.classList.toggle('hidden'));
    document.getElementById('settings-btn').addEventListener('click', () => document.getElementById('settings-panel').classList.toggle('open'));
    document.getElementById('close-settings').addEventListener('click', () => document.getElementById('settings-panel').classList.remove('open'));

    document.getElementById('vrm-input').addEventListener('change', async (e) => {
      const f = e.target.files[0]; if (f) { 
          const buf = await f.arrayBuffer(); await DBManager.saveFile('saved_vrm', f.name, buf, 'vrm'); 
          document.getElementById('vrm-local-info').innerText = `✅ 保存済み: ${f.name}`; 
          const btn = document.getElementById('btn-load-local-vrm');
          btn.style.display = 'block';
          btn.onclick = () => this.bus.dispatchEvent(new CustomEvent('vrm-load', { detail: { buffer: buf } }));
          this.bus.dispatchEvent(new CustomEvent('vrm-load', { detail: { buffer: buf } })); 
      }
    });

    document.getElementById('vrma-input').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files); if (files.length === 0) return;
      for(const f of files) { const buf = await f.arrayBuffer(); const dbId = `vrma_${Date.now()}_${f.name}`; await DBManager.saveFile(dbId, f.name, buf, 'vrma'); await this.loadVRMAFromBuffer(dbId, f.name, buf); }
      this.updateLibraryUI(); e.target.value = ''; window.showToast('モーションを登録しました');
    });

    document.getElementById('clear-lib-btn').addEventListener('click', async () => {
      for (const item of this.vrmaLibrary) await DBManager.deleteFile(item.id);
      this.vrmaLibrary = []; this.playlist = []; this.savePlaylist(); this.updateLibraryUI(); this.updatePlaylistUI(); window.showToast('全データを削除しました');
    });
    
    ['chk-sequence', 'chk-loop'].forEach(id => {
        const el = document.getElementById(id); const val = localStorage.getItem('vrm_' + id);
        if (val !== null) el.checked = (val === 'true');
        el.addEventListener('change', () => localStorage.setItem('vrm_' + id, el.checked));
    });
  }

  async loadVRMAFromBuffer(dbId, fileName, buffer) {
    const baseName = fileName.replace('.vrma', '');
    if (this.vrmaLibrary.find(v => v.name === baseName)) return;
    const blob = new Blob([buffer], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const gltfLoader = new GLTFLoader(); gltfLoader.register((parser) => new VRMAnimationLoaderPlugin(parser));
    try {
      const gltf = await gltfLoader.loadAsync(url);
      if (gltf.userData.vrmAnimations?.length > 0) this.vrmaLibrary.push({ id: dbId, name: baseName, animClip: gltf.userData.vrmAnimations[0] });
    } catch (err) { console.error(err); }
    URL.revokeObjectURL(url);
  }

  initControllers() {
    const widget = document.getElementById('dpad-widget'); const handle = document.getElementById('dpad-handle');
    const toggle = document.getElementById('dpad-toggle'); const panel = document.getElementById('dpad-panel');

    toggle.addEventListener('click', () => panel.classList.toggle('hidden'));
    
    panel.addEventListener('pointerdown', (e) => e.stopPropagation());
    panel.addEventListener('pointerup', (e) => e.stopPropagation());

    let isDragging = false; let startX, startY, initX, initY;
    handle.addEventListener('pointerdown', (e) => {
        e.stopPropagation(); 
        isDragging = true; startX = e.clientX; startY = e.clientY;
        const rect = widget.getBoundingClientRect(); initX = rect.left; initY = rect.top;
        handle.setPointerCapture(e.pointerId);
    });
    handle.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        let newX = initX + (e.clientX - startX); let newY = initY + (e.clientY - startY);
        newX = Math.max(0, Math.min(newX, window.innerWidth - 60)); newY = Math.max(0, Math.min(newY, window.innerHeight - 60));
        widget.style.left = `${newX}px`; widget.style.top = `${newY}px`; widget.style.bottom = 'auto'; widget.style.right = 'auto';
    });
    const endDrag = () => { isDragging = false; }; handle.addEventListener('pointerup', endDrag); handle.addEventListener('pointercancel', endDrag);

    const bindDpad = (id, dir) => {
        const btn = document.getElementById(id);
        const start = (e) => { 
            e.preventDefault(); e.stopPropagation(); 
            if (panel.classList.contains('hidden')) return; 
            this.bus.dispatchEvent(new CustomEvent('vrm-move-start', { detail: { dir } })); 
        };
        const stop = (e) => { 
            e.preventDefault(); e.stopPropagation(); 
            if (panel.classList.contains('hidden')) return; 
            this.bus.dispatchEvent(new CustomEvent('vrm-move-stop')); 
        };
        btn.addEventListener('pointerdown', start); btn.addEventListener('pointerup', stop); btn.addEventListener('pointerleave', stop); btn.addEventListener('pointercancel', stop);
    };
    bindDpad('btn-up', 'up'); bindDpad('btn-down', 'down'); bindDpad('btn-left', 'left'); bindDpad('btn-right', 'right');
    document.getElementById('btn-jump').addEventListener('pointerdown', (e) => { 
        e.preventDefault(); e.stopPropagation(); 
        if (panel.classList.contains('hidden')) return; 
        this.bus.dispatchEvent(new CustomEvent('vrm-action', { detail: { actionName: 'jump' } })); 
    });
  }

  updateLibraryUI() {
    this.libraryContainer.innerHTML = '';
    this.vrmaLibrary.forEach((item, index) => {
      const div = document.createElement('div'); div.className = 'playlist-item';
      const nameSpan = document.createElement('span'); nameSpan.className = 'playlist-name'; nameSpan.textContent = item.name;
      nameSpan.onclick = async () => { const newName = prompt('リネーム:', item.name); if (newName) { item.name = newName; const fd = await DBManager.getFile(item.id); if(fd) { fd.name = newName + '.vrma'; await DBManager.saveFile(fd.id, fd.name, fd.data, fd.type); } this.updateLibraryUI(); this.updatePlaylistUI(); } };

      const ctrlDiv = document.createElement('div'); ctrlDiv.className = 'playlist-controls';
      const playBtn = document.createElement('button'); playBtn.textContent = '▶'; playBtn.onclick = () => { this.uiContainer.classList.add('hidden'); this.bus.dispatchEvent(new CustomEvent('vrm-action', { detail: { actionName: item.name, animClip: item.animClip, playSource: 'single' } })); };
      
      const addBtn = document.createElement('button'); addBtn.textContent = '＋ 追加'; 
      addBtn.onclick = () => { this.playlist.push({...item}); this.savePlaylist(); this.updatePlaylistUI(); };
      
      const delBtn = document.createElement('button'); delBtn.textContent = '×'; delBtn.style.borderColor = 'var(--accent-danger)'; 
      delBtn.onclick = async () => { await DBManager.deleteFile(item.id); this.vrmaLibrary.splice(index, 1); this.playlist = this.playlist.filter(p => p.id !== item.id); this.savePlaylist(); this.updateLibraryUI(); this.updatePlaylistUI(); };

      ctrlDiv.appendChild(playBtn); ctrlDiv.appendChild(addBtn); ctrlDiv.appendChild(delBtn); div.appendChild(nameSpan); div.appendChild(ctrlDiv); this.libraryContainer.appendChild(div);
    });
  }

  updatePlaylistUI() {
    this.playlistContainer.innerHTML = '';
    this.playlist.forEach((item, index) => {
      const div = document.createElement('div'); div.className = 'playlist-item';
      if (index === this.currentPlayIndex) div.classList.add('active');

      const nameSpan = document.createElement('span'); nameSpan.className = 'playlist-name'; nameSpan.textContent = `${index+1}. ${item.name}`;

      const ctrlDiv = document.createElement('div'); ctrlDiv.className = 'playlist-controls';
      const playBtn = document.createElement('button'); playBtn.textContent = '▶'; 
      playBtn.onclick = () => { this.currentPlayIndex = index; this.updatePlaylistUI(); this.uiContainer.classList.add('hidden'); this.bus.dispatchEvent(new CustomEvent('vrm-action', { detail: { actionName: item.name, animClip: item.animClip, playSource: 'playlist' } })); };
      
      const delBtn = document.createElement('button'); delBtn.textContent = '削除'; 
      delBtn.onclick = () => { this.playlist.splice(index, 1); this.savePlaylist(); this.updatePlaylistUI(); };

      ctrlDiv.appendChild(playBtn); ctrlDiv.appendChild(delBtn); div.appendChild(nameSpan); div.appendChild(ctrlDiv); this.playlistContainer.appendChild(div);
    });
  }

  handlePlaylistSequence() {
    const isSeq = document.getElementById('chk-sequence').checked;
    const isLoop = document.getElementById('chk-loop').checked;

    if (isSeq && this.currentPlayIndex >= 0 && this.playlist.length > 0) {
        this.currentPlayIndex++;
        if (this.currentPlayIndex >= this.playlist.length) {
            if (isLoop) this.currentPlayIndex = 0; else { this.currentPlayIndex = -1; this.updatePlaylistUI(); return; }
        }
        const nextItem = this.playlist[this.currentPlayIndex];
        this.bus.dispatchEvent(new CustomEvent('vrm-action', { detail: { actionName: nextItem.name, animClip: nextItem.animClip, playSource: 'playlist' } }));
        this.updatePlaylistUI();
    } else if (isLoop && this.currentPlayIndex >= 0) {
        const item = this.playlist[this.currentPlayIndex];
        this.bus.dispatchEvent(new CustomEvent('vrm-action', { detail: { actionName: item.name, animClip: item.animClip, playSource: 'playlist' } }));
    } else {
        this.currentPlayIndex = -1; this.updatePlaylistUI();
    }
  }
}

const llmModule = new LLMModule(eventBus);
const vrmModule = new VRMModule(eventBus);
const extensionModule = new ExtensionModule(eventBus);

</script>
